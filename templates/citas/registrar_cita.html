<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cita Médica</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registrar_cita.css') }}">
</head>

<body>
    <div class="overlay">
        <div class="container py-5">

            <div class="card shadow-lg formulario-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h1 class="titulo-principal">
                            REGISTRAR CITA MÉDICA
                        </h1>

                        <p class="mensaje">
                            Complete la información para programar una nueva atención médica.
                        </p>

                    </div>

                    <form method="POST">

                        <!-- PACIENTE -->
                        <div class="mb-3">

                            <label class="form-label">
                                <i class="bi bi-person-fill"></i>
                                Paciente
                            </label>

                            <select class="form-select"
                                    name="paciente"
                                    required>

                                {% for paciente in pacientes %}

                                <option value="{{ paciente.paciente_id }}">

                                    {{ paciente.ci }}
                                    -
                                    {{ paciente.nombres }}
                                    {{ paciente.apellidos }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- MÉDICO -->
                        <div class="mb-3">

                            <label class="form-label">
                                <i class="bi bi-heart-pulse-fill"></i>
                                Médico
                            </label>

                            <select class="form-select"
                                    name="medico"
                                    required>

                                {% for medico in medicos %}

                                <option value="{{ medico.CodMedico }}">

                                    {{ medico.personal.Nombre }}
                                    {{ medico.personal.Apellidos }}
                                    -
                                    {{ medico.Especialidad }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- FECHA -->
                        <div class="mb-3">

                            <label class="form-label">
                                <i class="bi bi-calendar-event-fill"></i>
                                Fecha
                            </label>

                            <input type="date"
                                class="form-control"
                                name="fecha"
                                required>

                        </div>

                        <!-- HORA -->
                        <div class="mb-3">

                            <label class="form-label">
                                <i class="bi bi-clock-fill"></i>
                                Hora
                            </label>

                            <input type="time"
                                class="form-control"
                                name="hora"
                                required>

                        </div>

                        <!-- MOTIVO -->
                        <div class="mb-4">

                            <label class="form-label">
                                <i class="bi bi-journal-medical"></i>
                                Motivo de la Consulta
                            </label>

                            <textarea class="form-control"
                                    name="motivo"
                                    rows="4"
                                    placeholder="Describa brevemente el motivo de la consulta"></textarea>

                        </div>

                        <!-- BOTONES -->

                        <div class="d-grid gap-3">

                            <button type="submit"
                                    class="btn btn-success btn-lg efecto-sonido">

                                <i class="bi bi-save-fill"></i>
                                Guardar Cita

                            </button>

                            <a href="/listar_citas"
                            class="text-decoration-none boton-sonido">

                                <button type="button"
                                        class="btn btn-secondary btn-lg efecto-sonido w-100">

                                    <i class="bi bi-arrow-left-circle-fill"></i>
                                    Cancelar

                                </button>

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
