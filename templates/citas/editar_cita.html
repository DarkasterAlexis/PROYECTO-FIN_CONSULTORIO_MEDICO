<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- CSS -->
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/editar_cita.css') }}">
```

</head>
<body>

<div class="overlay">
    <div class="container py-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">

            <div class="text-center mb-4">
                <h1 class="titulo-principal">
                    EDITAR CITA MÉDICA
                </h1>

                <p class="mensaje">
                    Modifique la información de la cita médica registrada.
                </p>
            </div>

            <form method="POST">

                <!-- Datos paciente -->
                <div class="card card-info mb-4">
                    <div class="card-body">

                        <h4 class="seccion-titulo">
                            <i class="bi bi-person-fill"></i>
                            Información del Paciente
                        </h4>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Paciente
                                </label>

                                <input type="text"
                                       class="form-control"
                                       value="{{ cita.paciente.nombres }} {{ cita.paciente.apellidos }}"
                                       readonly>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    CI
                                </label>

                                <input type="text"
                                       class="form-control"
                                       value="{{ cita.paciente.ci }}"
                                       readonly>
                            </div>

                        </div>

                    </div>
                </div>

                <!-- Datos cita -->
                <div class="card card-info mb-4">
                    <div class="card-body">

                        <h4 class="seccion-titulo">
                            <i class="bi bi-calendar-check-fill"></i>
                            Información de la Cita
                        </h4>

                        <div class="mb-3">
                            <label class="form-label">
                                Médico
                            </label>

                            <select name="medico"
                                    class="form-select"
                                    required>

                                {% for medico in medicos %}
                                <option value="{{ medico.CodMedico }}"
                                    {% if medico.CodMedico == cita.CodMedico %}
                                        selected
                                    {% endif %}>
                                    {{ medico.personal.Nombre }}
                                    {{ medico.personal.Apellidos }}
                                    - {{ medico.Especialidad }}
                                </option>
                                {% endfor %}

                            </select>
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Fecha
                                </label>

                                <input type="date"
                                       name="fecha"
                                       class="form-control"
                                       value="{{ cita.Fecha }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Hora
                                </label>

                                <input type="time"
                                       name="hora"
                                       class="form-control"
                                       value="{{ cita.Hora.strftime('%H:%M') }}"
                                       required>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Motivo de Consulta
                            </label>

                            <textarea name="motivo"
                                      class="form-control"
                                      rows="4">{{ cita.Motivo }}</textarea>
                        </div>

                    </div>
                </div>

                <!-- Botones -->
                <div class="d-grid gap-3">

                    <button type="submit"
                            class="btn btn-success btn-lg boton-sonido efecto-sonido">

                        <i class="bi bi-save-fill"></i>
                        Guardar Cambios

                    </button>

                    <a href="/listar_citas"
                       class="text-decoration-none">

                        <button type="button"
                                class="btn btn-secondary btn-lg w-100 boton-sonido efecto-sonido">

                            <i class="bi bi-arrow-left-circle-fill"></i>
                            Cancelar

                        </button>

                    </a>

                </div>

            </form>

        </div>
    </div>
</div>

</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
