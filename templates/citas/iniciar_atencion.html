<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atención Médica</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/iniciar_atencion.css') }}">
</head>

<body>

<div class="overlay">

    <div class="container py-5">

        <div class="card shadow-lg">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <h1 class="titulo-principal">
                        ATENCIÓN MÉDICA
                    </h1>

                    <p class="mensaje">
                        Registro de consulta médica y evolución clínica.
                    </p>

                </div>

                <!-- Datos del paciente -->

                <div class="card datos-paciente mb-4">

                    <div class="card-header">

                        <i class="bi bi-person-vcard-fill"></i>
                        Datos del Paciente

                    </div>

                    <div class="card-body">

                        <div class="row">

                            <div class="col-md-4">
                                <strong>Paciente:</strong><br>
                                {{ cita.paciente.nombres }}
                                {{ cita.paciente.apellidos }}
                            </div>

                            <div class="col-md-4">
                                <strong>CI:</strong><br>
                                {{ cita.paciente.ci }}
                            </div>

                            <div class="col-md-4">
                                <strong>Teléfono:</strong><br>
                                {{ cita.paciente.telefono }}
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Formulario -->

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            <i class="bi bi-clipboard2-pulse-fill"></i>
                            Motivo de Consulta
                        </label>

                        <textarea
                            class="form-control"
                            name="motivo_consulta"
                            rows="4"
                            required></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            <i class="bi bi-search-heart-fill"></i>
                            Diagnóstico
                        </label>

                        <textarea
                            class="form-control"
                            name="diagnostico"
                            rows="4"
                            required></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            <i class="bi bi-capsule-pill"></i>
                            Tratamiento
                        </label>

                        <textarea
                            class="form-control"
                            name="tratamiento"
                            rows="4"
                            required></textarea>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            <i class="bi bi-journal-text"></i>
                            Observaciones
                        </label>

                        <textarea
                            class="form-control"
                            name="observaciones"
                            rows="4"></textarea>

                    </div>

                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg efecto-sonido">

                            <i class="bi bi-check-circle-fill"></i>
                            Guardar Atención

                        </button>

                        <a href="/agenda_medica"
                           class="btn btn-secondary btn-lg boton-sonido efecto-sonido">

                            <i class="bi bi-arrow-left-circle-fill"></i>
                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
