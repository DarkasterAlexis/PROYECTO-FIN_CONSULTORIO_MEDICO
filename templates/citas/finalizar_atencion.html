<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atención Finalizada</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/finalizar_atencion.css') }}">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg finalizar-card text-center">

        <div class="card-body p-5">

            <div class="icono-exito mb-4">

                <i class="bi bi-check-circle-fill"></i>

            </div>

            <h1 class="titulo-principal">
                ATENCIÓN FINALIZADA
            </h1>

            <p class="mensaje">

                La consulta médica fue registrada correctamente para el paciente:

                <br><br>

                <strong>
                    {{ cita.paciente.nombres }}
                    {{ cita.paciente.apellidos }}
                </strong>

            </p>

            <div class="info-paciente">

                <p>
                    <strong>CI:</strong>
                    {{ cita.paciente.ci }}
                </p>

                <p>
                    <strong>Médico:</strong>
                    Dr(a).
                    {{ cita.medico.personal.Nombre }}
                    {{ cita.medico.personal.Apellidos }}
                </p>

            </div>

            <hr>

            <h4 class="mb-4">
                ¿Qué desea hacer ahora?
            </h4>

            <div class="d-grid gap-3">

                <a href="/crear_receta/{{ historial.HistorialID }}"
                   class="text-decoration-none boton-sonido">

                    <button
                        class="btn btn-success btn-lg efecto-sonido w-100">

                        <i class="bi bi-file-earmark-medical-fill"></i>
                        Generar Receta Médica

                    </button>

                </a>

                <a href="/crear_cita_control/{{ cita.CodPaciente }}/{{ cita.CodMedico }}"
                   class="text-decoration-none boton-sonido">

                    <button
                        class="btn btn-warning btn-lg efecto-sonido w-100">

                        <i class="bi bi-calendar-plus-fill"></i>
                        Programar Cita de Control

                    </button>

                </a>

                <a href="/dashboard_medico"
                   class="text-decoration-none boton-sonido">

                    <button
                        class="btn btn-secondary btn-lg efecto-sonido w-100">

                        <i class="bi bi-house-door-fill"></i>
                        Volver al Panel Médico

                    </button>

                </a>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
