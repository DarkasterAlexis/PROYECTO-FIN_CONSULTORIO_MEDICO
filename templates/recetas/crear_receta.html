<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Receta Médica</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/crear_receta.css') }}">
</head>

<body>

<div class="overlay">

    <div class="container py-5">

        <div class="card shadow-lg formulario-card">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-file-earmark-medical-fill icono-principal"></i>

                    <h1 class="titulo-principal">
                        NUEVA RECETA MÉDICA
                    </h1>

                    <p class="mensaje">
                        Registro de prescripción médica para el paciente.
                    </p>

                </div>

                <div class="alert alert-info">

                    <p class="mb-2">

                        <strong>Paciente:</strong>

                        {{ paciente.nombres }}
                        {{ paciente.apellidos }}

                    </p>

                    <p class="mb-0">

                        <strong>Médico:</strong>

                        Dr(a).
                        {{ medico.personal.Nombre }}
                        {{ medico.personal.Apellidos }}

                    </p>

                </div>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del Medicamento
                        </label>

                        <input type="text"
                               name="medicamento"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Dosis
                        </label>

                        <input type="text"
                               name="dosis"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Frecuencia
                        </label>

                        <input type="text"
                               name="frecuencia"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Duración
                        </label>

                        <input type="text"
                               name="duracion"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Indicaciones
                        </label>

                        <textarea name="indicaciones"
                                  rows="4"
                                  class="form-control"></textarea>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Observaciones
                        </label>

                        <textarea name="observaciones"
                                  rows="4"
                                  class="form-control"></textarea>

                    </div>

                    <div class="d-grid gap-3">

                        <button type="submit"
                                class="btn btn-success btn-lg efecto-sonido">

                            <i class="bi bi-save-fill"></i>
                            Guardar Receta

                        </button>

                        <a href="/agenda_medica"
                           class="text-decoration-none boton-sonido">

                            <button type="button"
                                    class="btn btn-secondary btn-lg efecto-sonido w-100">

                                <i class="bi bi-arrow-left-circle-fill"></i>
                                Volver

                            </button>

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
