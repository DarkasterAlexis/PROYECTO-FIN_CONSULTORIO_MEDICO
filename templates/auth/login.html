<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="card shadow-lg login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="titulo-principal">INICIO DE SESIÓN</h2>
                <p class="text-muted"><h3 class="mensaje">Sistema Web para el Control de Atenciones
                    <br>Consultorio Médico ARANDA</h3>
                </p>
            </div>
            {% if error %}
                <div class="alert alert-danger text-center">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    {{ error }}
                </div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><h4 class="nombrelabop">Usuario</h4></label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text"class="form-control"name="usuario"placeholder="Ingrese su usuario"required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label"><h4 class="nombrelabop">Contraseña</h4></label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password"class="form-control"id="password"name="password"placeholder="Ingrese su contraseña"required>
                        <button class="btn btn-outline-secondary"type="button"id="togglePassword">
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                </div>
                <div class="d-grid gap-3">
                    <button type="submit"class="btn btn-primary btn-lg efecto-sonido">Iniciar Sesión</button>
                    <a href="/"class="text-decoration-none boton-sonido">
                        <button type="button" class="btn btn-secondary btn-lg efecto-sonido w-100">Volver al Inicio</button>
                    </a>
                </div>
            </form>
        </div>
    </div>
    <!-- Mostrar/Ocultar contraseña -->
    <script>
        const togglePassword = document.getElementById("togglePassword");
        const password = document.getElementById("password");
        togglePassword.addEventListener("click", () => {
            const tipo = password.getAttribute("type");
            password.setAttribute("type",tipo === "password" ? "text" : "password");
            togglePassword.innerHTML =tipo === "password"? '<i class="bi bi-eye-slash-fill"></i>': '<i class="bi bi-eye-fill"></i>';
        });
    </script>
    <!-- Sonidos y efectos -->
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
