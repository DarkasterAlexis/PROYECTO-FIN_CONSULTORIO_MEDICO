<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro Exitoso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registro_exitoso.css') }}">

</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="card shadow-lg registro-card text-center">

            <div class="card-body p-5">

                <div class="icono-exito mb-4">
                    <i class="bi bi-check-circle-fill"></i>
                </div>

                <h1 class="titulo-principal">
                    REGISTRO REALIZADO CORRECTAMENTE
                </h1>

                <p class="mensaje">
                    El médico:
                    <strong>{{ nombre }} {{ apellidos }}</strong>
                    fue registrado correctamente.
                    <br>
                    Ya forma parte del personal médico del consultorio.
                </p>

                <div class="d-grid gap-3 mt-4">

                    <a href="/listar_medicos"
                       class="text-decoration-none boton-sonido">

                        <button class="btn btn-primary btn-lg efecto-sonido w-100">

                            <i class="bi bi-clipboard2-pulse-fill"></i>
                            Ver Médicos Registrados

                        </button>

                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
