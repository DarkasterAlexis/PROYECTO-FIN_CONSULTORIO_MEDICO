<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Registrar Médico</title>


<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<!-- CSS -->
<link rel="stylesheet"
href="{{ url_for('static', filename='css/registrar_medico.css') }}">


</head>



<body>


<div class="container formulario-container">



<div class="card shadow-lg formulario-card">



<div class="card-body p-5">



<div class="text-center mb-4">


<i class="bi bi-person-badge-fill icono-principal"></i>


<h1 class="titulo-principal">
REGISTRO DE MÉDICO
</h1>


<p class="mensaje">
Ingrese los datos del nuevo profesional médico.
</p>


</div>





<form method="POST">





<!-- DATOS PERSONALES -->


<h4 class="seccion">

<i class="bi bi-person-fill"></i>

Datos Personales

</h4>




<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">
Nombre
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-person"></i>
</span>


<input type="text"
class="form-control"
name="nombre"
required>


</div>


</div>





<div class="col-md-6 mb-3">


<label class="form-label">
Apellidos
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-person-lines-fill"></i>
</span>


<input type="text"
class="form-control"
name="apellidos"
required>


</div>


</div>



</div>





<div class="mb-3">


<label class="form-label">
Teléfono
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-telephone-fill"></i>
</span>


<input type="text"
class="form-control"
name="telefono">


</div>


</div>







<!-- ACCESO -->


<h4 class="seccion mt-4">

<i class="bi bi-shield-lock-fill"></i>

Datos de Acceso

</h4>





<div class="mb-3">


<label class="form-label">
Usuario
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-person-circle"></i>
</span>


<input type="text"
class="form-control"
name="usuario"
required>


</div>


</div>





<div class="mb-3">


<label class="form-label">
Contraseña
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>


<input type="password"
class="form-control"
name="password"
required>


</div>


</div>







<!-- DATOS MEDICOS -->


<h4 class="seccion mt-4">


<i class="bi bi-heart-pulse-fill"></i>

Datos Médicos


</h4>





<div class="mb-3">


<label class="form-label">
Especialidad
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-hospital"></i>
</span>


<input type="text"
class="form-control"
name="especialidad"
required>


</div>


</div>





<div class="mb-4">


<label class="form-label">
Matrícula Profesional
</label>


<div class="input-group">


<span class="input-group-text">
<i class="bi bi-card-text"></i>
</span>


<input type="text"
class="form-control"
name="matricula"
required>


</div>


</div>






<div class="d-grid gap-3">


<button type="submit"
class="btn btn-success btn-lg boton-sonido efecto-sonido">


<i class="bi bi-save-fill"></i>

Guardar Médico


</button>





<a href="/dashboard_admin"
class="btn btn-secondary btn-lg boton-sonido efecto-sonido">


<i class="bi bi-arrow-left-circle-fill"></i>

Volver al Panel


</a>



</div>




</form>




</div>


</div>


</div>





<script src="{{ url_for('static', filename='js/index.js') }}"></script>



</body>

</html>
