<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/editar_paciente.css') }}">
</head>

<body>

    <div class="overlay">

        <div class="container py-5">

            <div class="card shadow-lg formulario-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h1 class="titulo-principal">
                            EDITAR PACIENTE
                        </h1>

                        <p class="mensaje">
                            Actualice la información del paciente registrado.
                        </p>

                    </div>

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    CI
                                </label>

                                <input type="text"
                                    class="form-control"
                                    name="ci"
                                    value="{{ paciente.ci }}"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Teléfono
                                </label>

                                <input type="text"
                                    class="form-control"
                                    name="telefono"
                                    value="{{ paciente.telefono }}">
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Nombres
                                </label>

                                <input type="text"
                                    class="form-control"
                                    name="nombres"
                                    value="{{ paciente.nombres }}"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Apellidos
                                </label>

                                <input type="text"
                                    class="form-control"
                                    name="apellidos"
                                    value="{{ paciente.apellidos }}"
                                    required>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Fecha de Nacimiento
                                </label>

                                <input type="date"
                                    class="form-control"
                                    name="fecha_nacimiento"
                                    value="{{ paciente.fecha_nacimiento }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Sexo
                                </label>

                                <select class="form-select" name="sexo">

                                    <option value="Masculino"
                                    {% if paciente.sexo=='Masculino' %}
                                    selected
                                    {% endif %}>
                                        Masculino
                                    </option>

                                    <option value="Femenino"
                                    {% if paciente.sexo=='Femenino' %}
                                    selected
                                    {% endif %}>
                                        Femenino
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Dirección
                            </label>

                            <input type="text"
                                class="form-control"
                                name="direccion"
                                value="{{ paciente.direccion }}">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Correo Electrónico
                            </label>

                            <input type="email"
                                class="form-control"
                                name="correo"
                                value="{{ paciente.correo }}">

                        </div>

                        <div class="d-grid gap-3">

                            <button type="submit"
                                    class="btn btn-success btn-lg efecto-sonido">

                                <i class="bi bi-check-circle-fill"></i>
                                Actualizar Paciente

                            </button>

                            <a href="/listar_pacientes"
                            class="text-decoration-none boton-sonido">

                                <button type="button"
                                        class="btn btn-secondary btn-lg efecto-sonido w-100">

                                    <i class="bi bi-arrow-left-circle-fill"></i>
                                    Cancelar

                                </button>

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

    </body>
</html>
