<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Personal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/editar_personal.css') }}">
</head>

<body>

    <div class="overlay">

        <div class="container d-flex justify-content-center align-items-center min-vh-100">

            <div class="card shadow-lg formulario-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h2 class="titulo-principal">
                            EDITAR PERSONAL
                        </h2>

                        <p class="mensaje">
                            Modifique los datos del personal registrado.
                        </p>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                value="{{ personal.Nombre }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Apellidos
                            </label>

                            <input
                                type="text"
                                name="apellidos"
                                class="form-control"
                                value="{{ personal.Apellidos }}"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Teléfono
                            </label>

                            <input
                                type="text"
                                name="telefono"
                                class="form-control"
                                value="{{ personal.Telefono }}">

                        </div>

                        <div class="d-grid gap-3">

                            <button type="submit"
                                    class="btn btn-success btn-lg efecto-sonido">

                                <i class="bi bi-save-fill"></i>
                                Guardar Cambios

                            </button>

                            <a href="/listar_personal"
                            class="text-decoration-none boton-sonido">

                                <button type="button"
                                        class="btn btn-secondary btn-lg w-100 efecto-sonido">

                                    <i class="bi bi-arrow-left-circle-fill"></i>
                                    Cancelar

                                </button>

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
