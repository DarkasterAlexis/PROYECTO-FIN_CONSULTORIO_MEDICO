<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Personal</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registrar_personal.css') }}">
</head>
<body>
    <div class="card shadow-lg formulario-card">
        <div class="card-body p-5">
            <h2 class="text-center titulo-principal mb-3">Registrar Personal</h2>
            <p class="text-center text-muted mb-4"><h6 class="mensaje">Complete los siguientes datos para registrar al personal autorizado del consultorio.</h6></p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><h4 class="nombrelabop">Nombre:</h4></label>
                    <input type="text"class="form-control"name="nombre"required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><h4 class="nombrelabop">Apellidos:</h4></label>
                    <input type="text"class="form-control"name="apellidos"required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><h4 class="nombrelabop">Teléfono:</h4></label>
                    <input type="number"class="form-control"name="telefono">
                </div>
                <div class="mb-3">
                    <label class="form-label"><h4 class="nombrelabop">Usuario:</h4></label>
                    <input type="text"class="form-control"name="usuario"required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><h4 class="nombrelabop">Contraseña:</h4></label>
                    <input type="password"class="form-control"name="password"required>
                </div>
                <div class="mb-4">
                    <label class="form-label"><h4 class="nombrelabop">Rol:</h4></label>
                    <select class="form-select"name="rol_id">
                        <option value="1">Administrador</option>
                        <option value="2">Recepcionista</option>
                    </select>
                    <div class="form-text">El rol Administrador aparece seleccionado por defecto para el primer registro del sistema.</div>
                </div>
                <div class="d-grid gap-3">
                    <button type="submit"class="btn btn-success btn-lg efecto-sonido">Guardar</button>
                    {% if session.get('usuario_id') %}
                        <a href="/dashboard_admin" class="text-decoration-none boton-sonido">
                    {% else %}
                        <a href="/" class="text-decoration-none boton-sonido">
                    {% endif %}
                            <button type="button"class="btn btn-secondary btn-lg efecto-sonido w-100">
                                {% if session.get('usuario_id') %}
                                    Cancelar
                                {% else %}
                                    Volver al Inicio
                                {% endif %}
                            </button>
                        </a>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
