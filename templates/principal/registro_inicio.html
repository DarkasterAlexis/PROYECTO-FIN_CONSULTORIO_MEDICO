<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro del Sistema</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registro_inicio.css') }}">

<body>
    <div class="card shadow-lg registro-card">

            <h1 class="titulo-principal">REGISTRO DEL SISTEMA</h1>
            <hr>

            </p>
            <div class="d-grid gap-3">
                <a href="/registrar_personal"
                   class="text-decoration-none boton-sonido">
                    <button type="button"class="btn btn-success btn-lg efecto-sonido w-100">Registrar Personal</button>
                </a>
                <a href="/"
                   class="text-decoration-none boton-sonido">
                    <button type="button"class="btn btn-secondary btn-lg efecto-sonido w-100">Volver al Inicio</button>

        </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
