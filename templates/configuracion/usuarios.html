<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios</title>
</head>
<body>
    <h1>Gestión de Usuarios</h1>
    <hr>
    <table border="1">
        <tr>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.nombre_usuario }}</td>
            <td>{{ usuario.rol.nombre_rol }}</td>
            <td>
                {% if usuario.estado %}
                Activo
                {% else %}
                Inactivo
                {% endif %}
            </td>
            <td><a href="/configuracion/usuario_estado/{{ usuario.usuario_id }}"><button>Cambiar Estado</button></a></td>
        </tr>
        {% endfor %}
    </table><br>
    <a href="/configuracion"><button>Volver</button></a>
</body>
</html>
