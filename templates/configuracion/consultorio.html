<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Consultorio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/consultorio.css') }}">
</head>

<body>

<div class="overlay">

    <div class="container py-5">

        <div class="card shadow-lg formulario-card">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-hospital-fill icono-principal"></i>

                    <h1 class="titulo-principal">
                        DATOS DEL CONSULTORIO
                    </h1>

                    <p class="mensaje">
                        Configure la información institucional del consultorio médico.
                    </p>

                </div>

                <form method="POST">

                    <!-- Nombre -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nombre del Consultorio
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-building"></i>
                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="nombre"
                                   value="{{ consultorio.nombre if consultorio else '' }}"
                                   placeholder="Ingrese el nombre del consultorio">

                        </div>

                    </div>

                    <!-- Dirección -->
                    <div class="mb-3">

                        <label class="form-label">
                            Dirección
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-geo-alt-fill"></i>
                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="direccion"
                                   value="{{ consultorio.direccion if consultorio else '' }}"
                                   placeholder="Ingrese la dirección">

                        </div>

                    </div>

                    <!-- Teléfono -->
                    <div class="mb-3">

                        <label class="form-label">
                            Teléfono
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-telephone-fill"></i>
                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="telefono"
                                   value="{{ consultorio.telefono if consultorio else '' }}"
                                   placeholder="Ingrese el teléfono">

                        </div>

                    </div>

                    <!-- Correo -->
                    <div class="mb-4">

                        <label class="form-label">
                            Correo Electrónico
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input type="email"
                                   class="form-control"
                                   name="correo"
                                   value="{{ consultorio.correo if consultorio else '' }}"
                                   placeholder="Ingrese el correo institucional">

                        </div>

                    </div>

                    <!-- Botones -->
                    <div class="d-grid gap-3">

                        <button type="submit"
                                class="btn btn-success btn-lg boton-sonido efecto-sonido">

                            <i class="bi bi-save-fill"></i>
                            Guardar Cambios

                        </button>

                        <a href="/configuracion"
                           class="btn btn-secondary btn-lg boton-sonido efecto-sonido">

                            <i class="bi bi-arrow-left-circle-fill"></i>
                            Volver a Configuración

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>

</body>
</html>
