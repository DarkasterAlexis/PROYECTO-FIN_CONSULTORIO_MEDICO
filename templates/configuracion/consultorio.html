<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos del Consultorio</title>
</head>
<body>
    <h1>Datos del Consultorio</h1>
    <form method="POST">
        <label for="">Nombre:</label>
        <input type="text"name="nombre"value="{{ consultorio.nombre if consultorio else '' }}"><br><br>
        <label for="">Dirección:</label>
        <input type="text"name="direccion"value="{{ consultorio.direccion if consultorio else '' }}"><br><br>
        <label for="">Teléfono:</label>
        <input type="text"name="telefono"value="{{ consultorio.telefono if consultorio else '' }}"><br><br>
        <label for="">Correo:</label>
        <input type="text"name="correo"value="{{ consultorio.correo if consultorio else '' }}"><br><br>
        <button>Guardar</button>
    </form>
    <br>
    <a href="/configuracion"><button>Volver</button></a>
</body>
</html>
